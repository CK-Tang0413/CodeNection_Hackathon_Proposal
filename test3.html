<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilibrium - Interactive Check-in</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-main: #2c3e50;
            --robot-teal: #a2d5c6;
            --robot-pink: #ff8fb3;
            --robot-dark: #1a1a24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Mobile Device Container */
        .mobile-frame {
            width: 390px;
            height: 844px;
            background: var(--bg-gradient);
            border-radius: 40px;
            box-shadow: -10px -10px 20px #ffffff, 10px 10px 20px #d1d9e6, inset 0 0 0 8px #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Add this to center everything vertically */
            padding: 40px 20px;
        }

        /* Speech Bubble */
        .speech-bubble {
            background: white;
            color: var(--text-main);
            padding: 15px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            text-align: center;
            z-index: 10;
        }

        .speech-bubble.active {
            opacity: 1;
            transform: translateY(0);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }

        /* Robot CSS Character */
        .robot-wrapper {
            position: relative;
            cursor: pointer;
            animation: float 4s ease-in-out infinite;
            margin-bottom: 20px; /* Changed from 40px */
            z-index: 5;
        }

        .robot-wrapper.dizzy {
            animation: shake 0.5s ease-in-out infinite;
        }

        .ear {
            width: 25px;
            height: 60px;
            background: var(--robot-pink);
            position: absolute;
            top: 45px;
            border-radius: 15px;
            box-shadow: inset -3px -3px 8px rgba(0,0,0,0.2);
            z-index: 1;
        }
        .ear.left { left: -15px; }
        .ear.right { right: -15px; }

        .antenna {
            width: 6px;
            height: 30px;
            background: #ccc;
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }
        .antenna-ball {
            width: 18px;
            height: 18px;
            background: var(--robot-pink);
            border-radius: 50%;
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.2);
        }

        .robot-head {
            width: 160px;
            height: 140px;
            background: var(--robot-teal);
            border-radius: 60px;
            position: relative;
            box-shadow: inset -5px -10px 20px rgba(0,0,0,0.15), 0 15px 25px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .robot-face {
            width: 130px;
            height: 80px;
            background: var(--robot-dark);
            border-radius: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .eye {
            width: 40px;
            height: 45px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 143, 179, 0.4);
            overflow: hidden;
            position: relative;
        }

        .pupil {
            width: 20px;
            height: 20px;
            background: var(--robot-dark);
            border-radius: 50%;
            transition: transform 0.1s ease-out; /* Smooth eye tracking */
        }

        .robot-wrapper.dizzy .pupil {
            animation: spin 0.5s linear infinite;
            background: conic-gradient(var(--robot-pink), #fff, var(--robot-pink));
        }

        .smile {
            position: absolute;
            bottom: 10px;
            width: 20px;
            height: 8px;
            border-bottom: 3px solid var(--robot-pink);
            border-radius: 0 0 20px 20px;
        }

        /* Conversational Interface */
        .chat-section {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 20px; /* Replaced 'auto' with a fixed spacing */
            margin-bottom: 0; /* Changed from 20px to keep it inside the frame */
        }

        .bot-prompt {
            font-size: 16px;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }

        .quick-replies {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reply-btn {
            background: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .reply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .reply-btn:active {
            transform: scale(0.98);
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-2deg); }
            20% { transform: translate(-3px, 0px) rotate(2deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(2deg); }
            50% { transform: translate(-1px, 2px) rotate(-2deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-2deg); }
            80% { transform: translate(-1px, -1px) rotate(2deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-2deg); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        
        <div class="speech-bubble" id="speechBubble">
            Hi! I'm here to help you balance your load.
        </div>

        <div class="robot-wrapper" id="robot">
            <div class="antenna-ball"></div>
            <div class="antenna"></div>
            <div class="ear left"></div>
            <div class="ear right"></div>
            
            <div class="robot-head">
                <div class="robot-face">
                    <div class="eye"><div class="pupil"></div></div>
                    <div class="eye"><div class="pupil"></div></div>
                    <div class="smile"></div>
                </div>
            </div>
        </div>

        <div class="chat-section">
            <div class="bot-prompt">How heavy is your Mental Load today?</div>
            <div class="quick-replies">
                <button class="reply-btn" onclick="nextQuestion()">Light & Breezy 🌬️</button>
                <button class="reply-btn" onclick="nextQuestion()">Manageable ⚖️</button>
                <button class="reply-btn" onclick="nextQuestion()">Overwhelming 🌪️</button>
            </div>
        </div>

    </div>

    <script>
        const robot = document.getElementById('robot');
        const speechBubble = document.getElementById('speechBubble');
        const pupils = document.querySelectorAll('.pupil');
        let clickCount = 0;
        let isDizzy = false;

        // Intro message logic
        setTimeout(() => {
            if(!isDizzy) {
                speechBubble.innerText = "Tap those buttons below to tell me how you're feeling!";
                speechBubble.classList.add('active');
                setTimeout(() => speechBubble.classList.remove('active'), 4000);
            }
        }, 1000);

        // 1. Eye Tracking Logic
        document.addEventListener('mousemove', (e) => {
            if(isDizzy) return; // Stop tracking if dizzy

            pupils.forEach(pupil => {
                // Get the center position of the eye
                const rect = pupil.parentElement.getBoundingClientRect();
                const eyeCenterX = rect.left + rect.width / 2;
                const eyeCenterY = rect.top + rect.height / 2;

                // Calculate vector from eye to mouse
                const deltaX = e.clientX - eyeCenterX;
                const deltaY = e.clientY - eyeCenterY;
                const angle = Math.atan2(deltaY, deltaX);

                // Max distance the pupil can move from the center
                const maxDistance = 10; 
                
                // Calculate actual pupil movement
                const pupilX = Math.cos(angle) * Math.min(maxDistance, Math.abs(deltaX / 10));
                const pupilY = Math.sin(angle) * Math.min(maxDistance, Math.abs(deltaY / 10));

                pupil.style.transform = `translate(${pupilX}px, ${pupilY}px)`;
            });
        });

        // 2. Click Interaction (Dizzy Logic)
        robot.addEventListener('click', () => {
            if(isDizzy) return; // Prevent spamming while already dizzy
            
            clickCount++;
            
            // Tease the user on the second click
            if(clickCount === 2) {
                speechBubble.innerText = "Hey, poking tickles!";
                speechBubble.classList.add('active');
                setTimeout(() => speechBubble.classList.remove('active'), 2000);
            }

            // Trigger Dizzy on 4th click
            if(clickCount >= 4) {
                isDizzy = true;
                clickCount = 0; // Reset counter
                
                // Apply dizzy CSS classes
                robot.classList.add('dizzy');
                speechBubble.innerText = "Ouch, you make me dizzy... 😵‍💫";
                speechBubble.classList.add('active');

                // Reset pupil transforms so the spin animation centers correctly
                pupils.forEach(p => p.style.transform = 'translate(0px, 0px)');

                // Recover after 3 seconds
                setTimeout(() => {
                    robot.classList.remove('dizzy');
                    speechBubble.innerText = "Phew! Okay, back to work.";
                    isDizzy = false;
                    
                    setTimeout(() => speechBubble.classList.remove('active'), 2500);
                }, 3000);
            }
        });

        // Simple function to demonstrate flow
        function nextQuestion() {
            const prompt = document.querySelector('.bot-prompt');
            prompt.innerText = "Got it! And what about your Time Load?";
            speechBubble.innerText = "Logging your data...";
            speechBubble.classList.add('active');
            setTimeout(() => speechBubble.classList.remove('active'), 2000);
        }
    </script>
</body>
</html>
