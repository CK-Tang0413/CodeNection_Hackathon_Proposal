<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Cartoon Dog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffe8c8;
      font-family: sans-serif;
    }

    .dog {
      position: relative;
      width: 300px;
      height: 300px;
    }

    /* Head */
    .head {
      position: absolute;
      width: 230px;
      height: 210px;
      left: 35px;
      top: 45px;
      background: #c9824b;
      border: 5px solid #713f2a;
      border-radius: 48% 48% 45% 45%;
      z-index: 2;
    }

    /* Ears */
    .ear {
      position: absolute;
      width: 75px;
      height: 120px;
      background: #8b512f;
      border: 5px solid #713f2a;
      border-radius: 50%;
      top: 55px;
      z-index: 1;
    }

    .ear.left {
      left: 10px;
      transform: rotate(25deg);
    }

    .ear.right {
      right: 10px;
      transform: rotate(-25deg);
    }

    /* Inner ears */
    .ear::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 82px;
      background: #c9824b;
      border-radius: 50%;
      top: 15px;
      left: 12px;
    }

    /* Eyes */
    .eye {
      position: absolute;
      width: 27px;
      height: 34px;
      background: #2d211c;
      border-radius: 50%;
      top: 100px;
    }

    .eye.left {
      left: 78px;
    }

    .eye.right {
      right: 78px;
    }

    /* Eye shine */
    .eye::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      top: 6px;
      left: 6px;
    }

    /* Muzzle */
    .muzzle {
      position: absolute;
      width: 125px;
      height: 75px;
      background: #f3c99b;
      border-radius: 50%;
      left: 47px;
      top: 125px;
    }

    /* Nose */
    .nose {
      position: absolute;
      width: 45px;
      height: 32px;
      background: #30221d;
      border-radius: 50% 50% 45% 45%;
      left: 42px;
      top: 8px;
    }

    .nose::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 7px;
      background: #5b4439;
      border-radius: 50%;
      left: 10px;
      top: 5px;
    }

    /* Mouth */
    .mouth {
      position: absolute;
      width: 48px;
      height: 25px;
      left: 38px;
      top: 38px;
      border-bottom: 4px solid #713f2a;
      border-radius: 0 0 50% 50%;
    }

    /* Tongue */
    .tongue {
      position: absolute;
      width: 30px;
      height: 42px;
      background: #f08080;
      border: 3px solid #713f2a;
      border-top: none;
      border-radius: 0 0 50% 50%;
      left: 48px;
      top: 58px;
      animation: happy 1.5s ease-in-out infinite;
    }

    @keyframes happy {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(5px);
      }
    }

    /* Little cheeks */
    .cheek {
      position: absolute;
      width: 25px;
      height: 14px;
      background: #e99b78;
      border-radius: 50%;
      top: 155px;
      opacity: 0.8;
    }

    .cheek.left {
      left: 45px;
    }

    .cheek.right {
      right: 45px;
    }

    /* Tail-like decorative heart */
    .heart {
      position: absolute;
      right: -5px;
      top: 15px;
      color: #f08080;
      font-size: 28px;
      transform: rotate(15deg);
      z-index: 5;
    }

    /* Floating hearts */
    .heart.one {
      right: 5px;
      top: -5px;
      font-size: 20px;
    }

    .heart.two {
      left: 5px;
      top: 20px;
      font-size: 18px;
      transform: rotate(-15deg);
    }
  </style>
</head>

<body>

  <div class="dog">

    <div class="heart one">♥</div>
    <div class="heart two">♥</div>

    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="head">

      <div class="eye left"></div>
      <div class="eye right"></div>

      <div class="cheek left"></div>
      <div class="cheek right"></div>

      <div class="muzzle">
        <div class="nose"></div>
        <div class="mouth"></div>
        <div class="tongue"></div>
      </div>

    </div>
  </div>

</body>
</html>
